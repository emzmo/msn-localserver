<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Admin Login</title>
<style>
body { font-family: sans-serif; margin: 2em; background: #f0f0f0; }
.box { max-width: 350px; margin: 2em auto; background: white; padding: 1.5em; border-radius: 5px; }
h1 { color: #003366; margin-top: 0; font-size: 1.3em; }
input[type=password] { width: 100%; padding: 6px; margin: 0.5em 0 1em; box-sizing: border-box; border: 1px solid #ccc; border-radius: 3px; }
.btn { width: 100%; padding: 8px; background: #0066cc; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 1em; }
.error { color: #cc0000; }
</style>
</head>
<body>
<div class="box">
<h1>MSN Museum Admin</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login">
<input type="password" name="password" placeholder="Admin password" autofocus>
<button type="submit" class="btn">Login</button>
</form>
</div>
</body>
</html>
