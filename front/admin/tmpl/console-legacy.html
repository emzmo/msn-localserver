<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>MSNP Console (Legacy)</title>
<style>
body { font-family: "Courier New", monospace; margin: 0; background: #1a1a2e; color: #0f0; font-size: 12px; }
.header { background: #003366; color: #fff; padding: 6px 12px; font-family: Arial, sans-serif; }
.header a { color: #99ccff; text-decoration: none; margin-right: 12px; }
.stats { float: right; color: #999; font-size: 10px; }
table.layout { width: 100%; border-collapse: collapse; }
td.sessions-col { width: 350px; vertical-align: top; border-right: 2px solid #333; }
td.log-col { vertical-align: top; padding: 0; }
.sessions-box { height: 500px; overflow-y: auto; padding: 6px; }
.log-box { height: 350px; overflow-y: auto; padding: 6px; }
.sb-box { height: 120px; overflow-y: auto; padding: 6px; border-top: 2px solid #333; color: #ff9966; }
.input-bar { background: #0d1117; padding: 6px; border-top: 2px solid #333; }
input, select, button { font-family: "Courier New", monospace; font-size: 12px; background: #0d1117; color: #0f0; border: 1px solid #333; padding: 3px 6px; }
button { cursor: pointer; background: #1a3a5c; }
button:hover { background: #2a4a6c; }
.btn-danger { background: #5c1a1a; }
.btn-small { font-size: 10px; padding: 1px 6px; }
table.data { width: 100%; border-collapse: collapse; }
th { color: #99ccff; text-align: left; padding: 3px 4px; font-size: 10px; border-bottom: 1px solid #333; }
td { padding: 2px 4px; border-bottom: 1px solid #222; font-size: 11px; }
.log-entry { padding: 1px 0; }
.log-in { color: #00ff00; }
.log-out { color: #00ffff; }
.log-info { color: #ff9966; }
.sb-entry { padding: 1px 0; }
.label { color: #99ccff; font-weight: bold; }
</style>
</head>
<body>
<div class="header">
<a href="/admin">Admin</a> | <a href="/admin/console">Console</a> | <a href="/admin/console-legacy">Legacy</a>
<span class="stats" id="stats"></span>
</div>

<table class="layout"><tr>
<td class="sessions-col">
<div class="sessions-box">
<div class="label">Sessions</div>
<table class="data">
<thead><tr><th>ID</th><th>Email</th><th>Client</th><th></th></tr></thead>
<tbody id="sessions"></tbody>
</table>
</div>
</td>
<td class="log-col">
<div class="log-box" id="log"></div>
<div class="sb-box" id="sb-log">
<div class="label">Chat Messages</div>
</div>
<div class="input-bar">
<select id="sess-select"><option value="">Session...</option></select>
<input type="text" id="cmd-input" style="width:200px">
<button onclick="sendCmd()">Send</button>
&nbsp;
<select id="from-select"><option value="">From: Server</option></select>
<input type="text" id="msg-email" style="width:160px">
<input type="text" id="msg-text" style="width:200px">
<button onclick="sendMsg()">MSG</button>
<button onclick="broadcast()" class="btn-danger">Broadcast</button>
</div>
</td>
</tr></table>

<script>
var logSeq = 0, sbSeq = 0;

function XHR() {
	if (window.XMLHttpRequest) return new XMLHttpRequest();
	return new ActiveXObject("Microsoft.XMLHTTP");
}

function apiGet(url, cb) {
	var x = XHR();
	x.open("GET", url, true);
	x.onreadystatechange = function() {
		if (x.readyState == 4 && x.status == 200) {
			var d;
			try { d = JSON.parse(x.responseText); }
			catch(e) { try { d = eval("(" + x.responseText + ")"); } catch(e2) { return; } }
			cb(d);
		}
	};
	x.send();
}

function apiPost(url, data, cb) {
	var x = XHR();
	x.open("POST", url, true);
	x.setRequestHeader("Content-Type", "application/json");
	x.onreadystatechange = function() {
		if (x.readyState == 4) {
			var d;
			try { d = JSON.parse(x.responseText); }
			catch(e) { try { d = eval("(" + x.responseText + ")"); } catch(e2) { d = {}; } }
			cb(d, x.status);
		}
	};
	x.send(JSON.stringify(data));
}

function esc(s) {
	var d = document.createElement("div");
	d.appendChild(document.createTextNode(s));
	return d.innerHTML;
}

function clearNode(el) {
	while (el.firstChild) el.removeChild(el.firstChild);
}

function makeButton(label, cls, onclick) {
	var btn = document.createElement("button");
	if (cls) btn.className = cls;
	btn.appendChild(document.createTextNode(label));
	if (btn.attachEvent) {
		btn.attachEvent("onclick", onclick);
	} else {
		btn.setAttribute("onclick", onclick);
	}
	return btn;
}

function addSessionRow(tbody, s) {
	var tr = document.createElement("tr");

	var td1 = document.createElement("td");
	td1.appendChild(document.createTextNode(s.id));
	tr.appendChild(td1);

	var td2 = document.createElement("td");
	td2.appendChild(document.createTextNode(s.email));
	tr.appendChild(td2);

	var td3 = document.createElement("td");
	td3.appendChild(document.createTextNode(s.client));
	tr.appendChild(td3);

	var td4 = document.createElement("td");
	var btn = document.createElement("button");
	btn.className = "btn-danger btn-small";
	btn.appendChild(document.createTextNode("Boot"));
	if (btn.attachEvent) {
		btn.attachEvent("onclick", function() { bootUser(s.email); });
	} else {
		btn.onclick = function() { bootUser(s.email); };
	}
	td4.appendChild(btn);
	tr.appendChild(td4);

	tbody.appendChild(tr);
}

function updateSessions() {
	apiGet("/admin/console/api/sessions", function(d) {
		var tbody = document.getElementById("sessions");
		var sel = document.getElementById("sess-select");
		clearNode(tbody);
		sel.options.length = 1;
		var sessions = d.sessions || [];
		for (var i = 0; i < sessions.length; i++) {
			var s = sessions[i];
			addSessionRow(tbody, s);
			sel.options[sel.options.length] = new Option(s.id + " " + s.email, s.id);
		}
		document.getElementById("stats").innerHTML = sessions.length + " sessions";
	});
}

function updateLog() {
	apiGet("/admin/console/api/log?since=" + logSeq, function(d) {
		if (d.latest_seq) logSeq = d.latest_seq;
		var area = document.getElementById("log");
		var entries = d.entries || [];
		var html = "";
		for (var i = 0; i < entries.length; i++) {
			var e = entries[i];
			var cls = e.dir == ">>>" ? "log-in" : (e.dir == "<<<" ? "log-out" : "log-info");
			var ts = new Date(e.ts * 1000).toLocaleTimeString();
			html += '<div class="log-entry ' + cls + '">[' + ts + '] ' + esc(e.session) + ' ' + e.dir + ' ' + esc(e.cmd) + '<\/div>';
		}
		if (html) {
			area.innerHTML = area.innerHTML + html;
			area.scrollTop = area.scrollHeight;
		}
	});
}

function updateSB() {
	apiGet("/admin/console/api/sb?since=" + sbSeq, function(d) {
		if (d.latest_seq) sbSeq = d.latest_seq;
		var area = document.getElementById("sb-log");
		var entries = d.entries || [];
		var html = "";
		for (var i = 0; i < entries.length; i++) {
			var e = entries[i];
			var ts = new Date(e.ts * 1000).toLocaleTimeString();
			html += '<div class="sb-entry">[' + ts + '] ' + esc(e.sender) + ' -> ' + esc(e.recipient) + ': ' + esc(e.body) + '<\/div>';
		}
		if (html) {
			area.innerHTML = area.innerHTML + html;
			area.scrollTop = area.scrollHeight;
		}
	});
}

function updateFromSelect() {
	apiGet("/admin/console/api/users", function(d) {
		var sel = document.getElementById("from-select");
		sel.options.length = 1;
		var users = d.users || [];
		for (var i = 0; i < users.length; i++) {
			sel.options[sel.options.length] = new Option(users[i].email, users[i].email);
		}
	});
}

function sendCmd() {
	var sel = document.getElementById("sess-select");
	var inp = document.getElementById("cmd-input");
	if (!sel.value || !inp.value) return;
	apiPost("/admin/console/api/send", {session_id: sel.value, command: inp.value}, function() {});
	inp.value = "";
}

function sendMsg() {
	var fromEmail = document.getElementById("from-select").value;
	var toEmail = document.getElementById("msg-email").value;
	var text = document.getElementById("msg-text").value;
	if (!toEmail || !text) return;
	var payload = {email: toEmail, text: text};
	if (fromEmail) payload.from_email = fromEmail;
	apiPost("/admin/console/api/msg", payload, function() {});
	document.getElementById("msg-text").value = "";
}

function broadcast() {
	var text = document.getElementById("msg-text").value;
	if (!text) return;
	apiPost("/admin/console/api/broadcast", {text: text}, function() {});
	document.getElementById("msg-text").value = "";
}

function bootUser(email) {
	if (!confirm("Boot " + email + "?")) return;
	apiPost("/admin/console/api/boot", {email: email}, function() {});
}

function poll() {
	updateSessions();
	updateLog();
	updateSB();
}

poll();
updateFromSelect();
setInterval(poll, 2000);
setInterval(updateFromSelect, 30000);
</script>
</body>
</html>
