{% extends "base.html" %}
{% block content %}
<h1>{{ t.signup_title }}</h1>
<p>{{ t.signup_desc }}</p>

{% if error_msg %}

<form method="post" action="/signup">

<tr><td><label for="password">{{ t.password }}:</label></td><td><input type="password" name="password" id="password" class="msn-input" size="15"></td></tr>
<tr><td><label for="name">{{ t.display_name }}:</label></td><td>
<select name="name" class="msn-input">

<option value="Saoirse">Saoirse</option>
<option value="Conor">Conor</option>
<option value="Éabha">Éabha</option>
<option value="Tadhg">Tadhg</option>
<option value="Maeve">Maeve</option>
<option value="Fionn">Fionn</option>
