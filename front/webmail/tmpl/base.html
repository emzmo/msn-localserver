<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>{% block title %}MSN Hotmail{% endblock %}</title>
<style>
body {
	font-family: "MS Sans Serif", Arial, Helvetica, sans-serif;
	font-size: 11px;
	margin: 0;
	background: #336699;
	color: #000000;
}
.hm-topbar { background: #003366; color: #ffffff; padding: 4px 10px; font-size: 11px; }
.hm-topbar a { color: #ffffff; text-decoration: none; }
.hm-topbar a:hover { text-decoration: underline; }
.hm-logo-bar { background: #ffffff; padding: 6px 10px; border-bottom: 2px solid #336699; }
.hm-logo-bar .logo { font-family: Verdana, Arial, sans-serif; font-size: 22px; font-weight: bold; color: #003366; letter-spacing: -1px; }
.hm-logo-bar .logo .hm { color: #336699; }
.hm-logo-bar .user { float: right; color: #666666; font-size: 11px; }
.hm-nav { background: #336699; color: #ffffff; padding: 3px 10px; font-size: 11px; }
.hm-nav a { color: #ffffff; text-decoration: none; margin-right: 14px; font-weight: bold; }
.hm-nav a:hover { text-decoration: underline; }
.hm-container { background: #ffffff; margin: 0 auto; width: 760px; border-left: 1px solid #cccccc; border-right: 1px solid #cccccc; min-height: 400px; }
.hm-content { padding: 12px 16px; }
.hm-footer { background: #003366; color: #cccccc; text-align: center; padding: 6px; font-size: 10px; margin-top: 10px; }
.hm-footer a { color: #99ccff; }
.hm-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.hm-table th { background: #336699; color: #ffffff; padding: 4px 8px; text-align: left; font-weight: bold; border: 1px solid #2c5a86; }
.hm-table td { padding: 4px 8px; border-bottom: 1px solid #eeeeee; vertical-align: top; }
.hm-table tr.unread td { font-weight: bold; background: #fffbe6; }
.hm-table tr.read td { color: #333333; }
.hm-table a { color: #003399; text-decoration: none; }
.hm-table a:hover { text-decoration: underline; color: #cc3300; }
.hm-btn { display: inline-block; padding: 4px 14px; background: #336699; color: #ffffff; border: 1px solid #003366; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; }
.hm-btn:hover { background: #003366; }
.hm-btn-sec { background: #eeeeee; color: #333333; border: 1px solid #999999; }
.hm-btn-sec:hover { background: #dddddd; }
.hm-input { border: 1px solid #7f9db9; padding: 3px; font-family: "MS Sans Serif", Arial, sans-serif; font-size: 11px; width: 100%; box-sizing: border-box; }
.hm-textarea { border: 1px solid #7f9db9; padding: 3px; font-family: "MS Sans Serif", Arial, sans-serif; font-size: 11px; width: 100%; box-sizing: border-box; }
.hm-error { color: #cc0000; font-weight: bold; padding: 6px; background: #fff2f2; border: 1px solid #cc0000; margin-bottom: 10px; }
.hm-success { color: #006600; font-weight: bold; padding: 6px; background: #f2fff2; border: 1px solid #006600; margin-bottom: 10px; }
.hm-pagehead { background: #e8eef7; border: 1px solid #c5d6e8; padding: 6px 10px; margin-bottom: 10px; font-weight: bold; color: #003366; font-size: 13px; }
.hm-row-actions { white-space: nowrap; }
.hm-row-actions a { margin-right: 8px; }
.hm-legend { color: #666666; font-size: 10px; margin-top: 4px; }
.hm-fields { width: 100%; }
.hm-fields th { text-align: right; padding: 6px 10px 6px 0; color: #003366; font-weight: bold; width: 80px; vertical-align: top; }
.hm-fields td { padding: 6px 0; }
.hm-empty { text-align: center; color: #666666; padding: 30px; font-style: italic; }
.hm-header-block { background: #f4f8fc; border: 1px solid #c5d6e8; padding: 10px; margin-bottom: 12px; }
.hm-header-block .row { padding: 3px 0; border-bottom: 1px dotted #dddddd; }
.hm-header-block .row:last-child { border-bottom: none; }
.hm-header-block .lbl { color: #666666; font-weight: bold; display: inline-block; width: 70px; }
.hm-body-block { background: #ffffff; border: 1px solid #c5d6e8; padding: 14px; min-height: 200px; font-family: "MS Sans Serif", Arial, sans-serif; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<div class="hm-topbar">
	<a href="/">MSN Home</a> &nbsp;|&nbsp; <a href="/webmail/inbox">Hotmail</a> &nbsp;|&nbsp; <a href="/info">Messenger</a>
</div>
<div class="hm-logo-bar">
	<span class="logo"><span class="hm">MSN</span> Hotmail</span>
	{% if email %}<span class="user">Welcome, {{ email }} &nbsp; <a href="/webmail/logout" style="color:#003399">Sign out</a></span>{% endif %}
</div>
{% if email %}
<div class="hm-nav">
	<a href="/webmail/inbox">Inbox</a>
	<a href="/webmail/compose">Compose</a>
</div>
{% endif %}
<div class="hm-container">
	<div class="hm-content">
		{% block content %}{% endblock %}
	</div>
</div>
<div class="hm-footer">
	&copy; 2003 Microsoft Corporation. All rights reserved. &nbsp;|&nbsp;
	<a href="https://github.com/emzmo/msn-localserver">MSN Museum Project</a>
</div>
</body>
</html>
